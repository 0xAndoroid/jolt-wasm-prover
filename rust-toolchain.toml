[toolchain]
# Stable rather than nightly: current nightlies alias
# `core::convert::Infallible` to `!`, which breaks `allocative` 0.3 (a hard
# dependency through jolt's `common/std`) with conflicting impls. The wasm
# build still needs `-Z build-std`; enable it on stable with
# `RUSTC_BOOTSTRAP=1` (see README).
channel = "1.99"
components = ["rust-src", "clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown", "riscv64imac-unknown-none-elf"]
