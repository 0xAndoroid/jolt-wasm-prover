name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: scripts/lint/web.sh
      - run: npm run build
        working-directory: frontend
      - if: always()
        run: echo "frontend wall $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

  rust-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: scripts/lint/rust.sh native
      - if: always()
        run: echo "rust-native wall $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

  rust-device:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy
      - run: ./setup-wasm-deps.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: scripts/lint/rust.sh device
      - if: always()
        run: echo "rust-device wall $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

  rust-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy,rust-src
          targets: wasm32-unknown-unknown
      - run: ./setup-wasm-deps.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: scripts/lint/rust.sh wasm
      - if: always()
        run: echo "rust-wasm wall $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

  shell-python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: shellcheck@0.11.0,shfmt@3.14.1,typos@1.50.3
      - uses: astral-sh/setup-uv@v7
      - run: scripts/lint/shell.sh
      - run: scripts/lint/python.sh
      - run: typos
      - if: always()
        run: echo "shell-python wall $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"
