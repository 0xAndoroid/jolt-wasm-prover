name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '37 8 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nightly-preflight:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      decision: ${{ steps.history.outputs.decision }}
    steps:
      - name: Compare with the last completed nightly
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          actions="repos/$GITHUB_REPOSITORY/actions"
          current=$(gh api "$actions/runs/$GITHUB_RUN_ID")
          identity=$(jq -er --arg id "$GITHUB_RUN_ID" --arg number "$GITHUB_RUN_NUMBER" \
            --arg sha "$GITHUB_SHA" --arg branch "$GITHUB_REF_NAME" '
              select((.id | tostring) == $id and (.run_number | tostring) == $number and
                     .head_sha == $sha and .head_branch == $branch and .event == "schedule" and
                     .path == ".github/workflows/ci.yml" and (.workflow_id | type) == "number" and
                     (.created_at | fromdateiso8601) > 0)
              | [.workflow_id, .created_at] | @tsv
            ' <<< "$current")
          IFS=$'\t' read -r workflow created <<< "$identity"
          history=$(gh api -X GET "$actions/workflows/$workflow/runs" \
            -f event=schedule -f branch="$GITHUB_REF_NAME" -f status=completed -f created="<$created" -F per_page=30)
          candidates=$(jq -r --argjson workflow "$workflow" --argjson id "$GITHUB_RUN_ID" \
            --argjson number "$GITHUB_RUN_NUMBER" --arg branch "$GITHUB_REF_NAME" --arg created "$created" '
              def sha: type == "string" and test("^[0-9a-f]{40}$");
              def number: type == "number" and . >= 1 and . == floor;
              if (.workflow_runs | type) != "array" or (.total_count | type) != "number" or
                 (.workflow_runs | length) != ([.total_count, 30] | min) then error("Invalid workflow run response")
              else .workflow_runs end
              | map(if (.id | number) and (.run_number | number) and (.run_attempt | number) and
                       (.head_sha | sha) and (.created_at | fromdateiso8601) > 0 and
                       (.updated_at | fromdateiso8601) > 0 and
                       (.status != "completed" or (.conclusion | type) == "string") and
                       (.workflow_id | number) and (.event | type) == "string" and
                       (.head_branch | type) == "string" and (.status | type) == "string"
                    then . else error("Invalid workflow run record") end)
              | map(select(.workflow_id == $workflow and .id != $id and .run_number < $number and
                           .head_branch == $branch and .event == "schedule" and .status == "completed" and
                           .created_at < $created and .updated_at < $created and
                           (.conclusion == "success" or .conclusion == "failure")))
              | sort_by(.run_number) | reverse[] | [.id, .run_attempt, .head_sha, .conclusion] | @tsv
            ' <<< "$history")

          decision=run
          while IFS=$'\t' read -r id attempt sha conclusion; do
            [[ -n "$id" ]] || break
            if [[ "$conclusion" == failure ]]; then
              jobs=$(gh api -X GET "$actions/runs/$id/attempts/$attempt/jobs" -F per_page=100)
              finished=$(jq -er --argjson attempt "$attempt" '
                if (.jobs | type) != "array" or (.jobs | length) != .total_count or
                   any(.jobs[]; (.name | type) != "string" or (.steps | type) != "array" or
                                (.conclusion | type) != "string" or .run_attempt != $attempt)
                then error("Invalid workflow job response") else .jobs end
                | map(select(.name != "nightly-preflight"))
                | if map(.name) | sort == ["ci", "frontend", "rust-device", "rust-native", "rust-wasm", "shell-python"]
                  then all(.[]; (.conclusion == "success" or .conclusion == "failure") and
                                all(.steps[]; .conclusion != "cancelled" and .conclusion != "timed_out"))
                  else false end | tostring
              ' <<< "$jobs")
              [[ "$finished" == true ]] || continue
            fi
            if [[ "$sha" == "$GITHUB_SHA" ]]; then
              decision=skip
              echo "Skipping suites: SHA $sha already covered by scheduled run $id." >> "$GITHUB_STEP_SUMMARY"
            fi
            break
          done <<< "$candidates"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"

  frontend:
    needs: nightly-preflight
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.nightly-preflight.outputs.decision == 'run') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: scripts/lint/web.sh
      - run: npm run build
        working-directory: frontend
      - if: always()
        run: echo "frontend wall $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

  rust-native:
    needs: nightly-preflight
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.nightly-preflight.outputs.decision == 'run') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 45 }}
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/lint/rust.sh native
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest@0.9.146
      - name: Native test suite
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: cargo nextest run --cargo-quiet --locked --release --features native --no-tests fail
      - if: always()
        run: echo "rust-native wall $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

  rust-device:
    needs: nightly-preflight
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.nightly-preflight.outputs.decision == 'run') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 45 }}
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          components: clippy
      - run: ./setup-wasm-deps.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('setup-wasm-deps.sh', 'patches/**') }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/lint/rust.sh device
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest@0.9.146
      - name: Native test suite with device features
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: cargo nextest run --cargo-quiet --locked --release --features native,trace-commit-device,digit-range-device,relation-range-device --no-tests fail
      - if: always()
        run: echo "rust-device wall $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

  rust-wasm:
    needs: nightly-preflight
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.nightly-preflight.outputs.decision == 'run') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 20 || 45 }}
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Select browser checks
        id: browser
        if: github.event_name != 'push'
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            changed=$(git diff --name-only --no-renames HEAD^1 HEAD)
            non_docs=$(git diff --name-only --no-renames HEAD^1 HEAD -- . ':(exclude,glob)**/*.md')
            if [[ -n "$changed" && -z "$non_docs" ]] &&
              git diff --quiet --no-renames HEAD^1 HEAD -- frontend/src frontend/public; then
              echo 'Browser smoke not selected: Markdown-only change.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo 'selected=true' >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          components: clippy,rust-src
          targets: wasm32-unknown-unknown
      - run: ./setup-wasm-deps.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('setup-wasm-deps.sh', 'patches/**') }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/lint/rust.sh wasm
      - if: steps.browser.outputs.selected == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.browser.outputs.selected == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - if: steps.browser.outputs.selected == 'true'
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: wasm-pack@0.15.0
      - name: Build browser package
        if: steps.browser.outputs.selected == 'true'
        env:
          RUSTC_BOOTSTRAP: 1
          CARGO_UNSTABLE_BUILD_STD: panic_abort,std
        run: |
          wasm-pack build --release --target web -- --features webgpu,trace-commit-device,digit-range-device,relation-range-device
          npm ci --ignore-scripts --prefix frontend
          npm run build --prefix frontend
      - name: Run browser checks
        if: steps.browser.outputs.selected == 'true'
        timeout-minutes: ${{ github.event_name == 'pull_request' && 3 || 25 }}
        run: |
          node server.mjs &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused http://127.0.0.1:8080/ >/dev/null
          uv run --with playwright==1.64.1 bash -e <<'BROWSER'
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            playwright install --with-deps --only-shell chromium
            python bench/test_ui_modes.py --smoke
          else
            playwright install --with-deps chromium webkit
            python bench/test_ui_modes.py
          fi
          BROWSER
      - if: always()
        run: echo "rust-wasm wall $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

  shell-python:
    needs: nightly-preflight
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.nightly-preflight.outputs.decision == 'run') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: shellcheck@0.11.0,shfmt@3.14.1,typos@1.51.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: scripts/lint/shell.sh
      - run: scripts/lint/python.sh
      - run: typos
      - if: always()
        run: echo "shell-python wall $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

  ci:
    # GitHub accepts skipped required checks, so the aggregate must still run.
    if: always()
    needs: [nightly-preflight, frontend, rust-native, rust-device, rust-wasm, shell-python]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - if: always()
        env:
          JOBS: ${{ toJSON(needs) }}
        run: |
          jq -e --arg event "$GITHUB_EVENT_NAME" '
            .["nightly-preflight"] as $preflight
            | del(.["nightly-preflight"])
            | if keys != ["frontend", "rust-device", "rust-native", "rust-wasm", "shell-python"] then false
              elif $event != "schedule" then all(.[]; .result == "success")
              elif $preflight.result != "success" then false
              elif $preflight.outputs.decision == "skip" then all(.[]; .result == "skipped")
              elif $preflight.outputs.decision == "run" then all(.[]; .result == "success")
              else false end
          ' <<< "$JOBS"
