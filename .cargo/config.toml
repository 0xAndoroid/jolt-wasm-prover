[target.wasm32-unknown-unknown]
rustflags = [
  "-C", "target-feature=+atomics,+bulk-memory,+mutable-globals",
  "-C", "link-arg=--shared-memory",
  "-C", "link-arg=--max-memory=4294967296",
  "-C", "link-arg=--import-memory",
  "-C", "link-arg=--export=__wasm_init_tls",
  "-C", "link-arg=--export=__tls_size",
  "-C", "link-arg=--export=__tls_align",
  "-C", "link-arg=--export=__tls_base",
  "-C", "link-arg=--export=__heap_base",
  # Main-thread stack. The Akita backend kernels recurse deeply inside rayon
  # parallel iterators and carry large frames (jolt-akita runs them on 64 MiB
  # worker stacks natively); the default 1 MiB wasm stack overflows. Worker
  # thread stacks are sized separately by worker.js (`thread_stack_size`).
  "-C", "link-arg=-zstack-size=33554432",
  "-C", "opt-level=3",
  # The `name` custom section is 33 MB on the full-feature build and pushes the
  # wasm past Cloudflare Pages' 25 MiB per-file cap (code + data are ~23 MB).
  # Drop it for the shipped artifact; a profiling build removes this flag.
  "-C", "strip=symbols",
  "-A", "long_running_const_eval",
]
